name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runtime: win-x64
            platform: x64
          - runtime: win-arm64
            platform: ARM64
    env:
      RID: ${{ matrix.runtime }}
      PLATFORM: ${{ matrix.platform }}
      NUGET_PACKAGES: ${{ runner.temp }}/nuget
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Version
        run: |
          $project = [xml](Get-Content -Raw Docklet.csproj)
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -cne "v$version") {
            throw 'The tag must match v<Version> in Docklet.csproj.'
          }
          "PACKAGE=Docklet-$version-$env:RID" >> $env:GITHUB_ENV

      - name: Restore
        run: >-
          dotnet restore Docklet.csproj -r $env:RID
          -p:Platform=$env:PLATFORM -p:SelfContained=true
          -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true

      - name: Publish
        run: >-
          dotnet publish Docklet.csproj --no-restore -c Release -r $env:RID
          --self-contained true -o publish -p:Platform=$env:PLATFORM
          -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
          -p:EnableMsixTooling=false -p:EnableWinAppRunSupport=false
          -p:PublishTrimmed=false -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false

      - name: ZIP
        run: Compress-Archive -Path publish/* -DestinationPath "$env:PACKAGE.zip"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.zip
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: Docklet-*
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum *.zip > "Docklet-${GITHUB_REF_NAME#v}-SHA256SUMS.txt"
          gh release create "$GITHUB_REF_NAME" ./* --verify-tag --draft --generate-notes --title "Docklet ${GITHUB_REF_NAME#v}"
          gh release edit "$GITHUB_REF_NAME" --draft=false
